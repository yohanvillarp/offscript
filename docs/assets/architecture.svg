<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" aria-labelledby="title description" role="img" viewBox="0 0 960 530"><title id="title">OFFSCRIPT local architecture</title><desc id="description">The CLI and Studio use a protected local host. Application rules persist to SQLite. Mozaik coordinates concurrent users through shared exploration state and isolated Playwright contexts. Default inference is deterministic.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#68716B" d="M0 0 10 5 0 10"/></marker></defs><rect width="960" height="530" fill="#F6F6F3" rx="10"/><g fill="#222724" font-family="system-ui, sans-serif"><text x="36" y="43" font-size="21" font-weight="600">OFFSCRIPT · local architecture</text><text x="36" y="69" fill="#68716B" font-size="13">Composition and data boundaries · default decisions use a deterministic runner</text><g fill="none" stroke="#68716B" stroke-width="1.5" marker-end="url(#arrow)"><path d="M222 130 H300"/><path d="M222 200 H260 V150 H300"/><path d="M490 140 H560"/><path d="M740 140 H804"/><path d="M395 170 V255"/><path d="M280 294 H300"/><path marker-start="url(#arrow)" d="M490 294 H560"/><path d="M395 332 V390"/><path d="M490 424 H560"/><path d="M740 424 H804"/></g><g fill="#FFF" stroke="#DADDD6"><rect width="186" height="52" x="36" y="104" rx="6"/><rect width="186" height="52" x="36" y="174" rx="6"/><rect width="190" height="66" x="300" y="104" rx="6"/><rect width="180" height="66" x="560" y="104" rx="6"/><rect width="120" height="66" x="804" y="104" rx="6"/><rect width="244" height="58" x="36" y="265" rx="6"/><rect width="190" height="77" x="300" y="255" fill="#E1EFE9" rx="6"/><rect width="220" height="58" x="560" y="265" rx="6"/><rect width="190" height="68" x="300" y="390" rx="6"/><rect width="180" height="68" x="560" y="390" rx="6"/><rect width="120" height="68" x="804" y="390" rx="6"/></g><g font-size="14" text-anchor="middle"><text x="129" y="136">offscript CLI</text><text x="129" y="206">Local Studio</text><text x="395" y="133">Protected host</text><text x="395" y="153" fill="#68716B" font-size="12">Loopback · authenticated API</text><text x="650" y="133">Application / domain</text><text x="650" y="153" fill="#68716B" font-size="12">Lifecycle and investigation rules</text><text x="864" y="133">SQLite</text><text x="864" y="153" fill="#68716B" font-size="12">Snapshots / outbox</text><text x="158" y="289">Deterministic runner</text><text x="158" y="309" fill="#68716B" font-size="12">Default browser/demo integration</text><text x="395" y="286" fill="#237763" font-weight="600">Mozaik runtime</text><text x="395" y="308" fill="#237763" font-size="12">One runtime per simulation</text><text x="670" y="289">Shared exploration state</text><text x="670" y="309" fill="#68716B" font-size="12">Observations · investigations</text><text x="395" y="417">Concurrent users</text><text x="395" y="439" fill="#68716B" font-size="12">Separate identities and memory</text><text x="650" y="417">Playwright contexts</text><text x="650" y="439" fill="#68716B" font-size="12">Isolated browser storage</text><text x="864" y="417">Target app</text><text x="864" y="439" fill="#68716B" font-size="12">Operator-authorized</text></g><text x="36" y="497" fill="#68716B" font-size="12">The host does not start target services. Shared exploration state does not grant permissions or confirm a defect.</text></g></svg>