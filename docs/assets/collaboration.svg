<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" aria-labelledby="title description" role="img" viewBox="0 0 960 440"><title id="title">Parallel users and reactive collaboration through Mozaik</title><desc id="description">Two users inspect independently. An observation and investigation request enter shared state; a peer reacts, persists its assignment and contributes. This is an illustrative coordination flow, not a recording of live reasoning.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#237763" d="M0 0 10 5 0 10"/></marker></defs><rect width="960" height="440" fill="#F6F6F3" rx="10"/><g fill="#222724" font-family="system-ui, sans-serif"><text x="36" y="40" font-size="21" font-weight="600">Parallel turns. Shared observations.</text><text x="36" y="66" fill="#68716B" font-size="13">Illustrative flow of the controlled Mozaik integration demo</text><g fill="#FFF" stroke="#DADDD6"><rect width="160" height="44" x="80" y="94" rx="6"/><rect width="250" height="44" x="355" y="94" fill="#E1EFE9" rx="6"/><rect width="160" height="44" x="720" y="94" rx="6"/></g><g font-size="14" text-anchor="middle"><text x="160" y="122">User A</text><text x="480" y="122" fill="#237763">Mozaik / shared state</text><text x="800" y="122">User B</text></g><g stroke="#DADDD6" stroke-dasharray="4 5"><path d="M160 138 V375"/><path d="M480 138 V375"/><path d="M800 138 V375"/></g><g fill="#EEEFEA"><rect width="150" height="32" x="85" y="153" rx="4"/><rect width="150" height="32" x="725" y="153" rx="4"/></g><g fill="#68716B" font-size="12" text-anchor="middle"><text x="160" y="174">Independent inspection</text><text x="800" y="174">Independent inspection</text></g><g fill="none" stroke="#237763" stroke-width="1.5" marker-end="url(#arrow)"><path d="M160 221 H480"/><path d="M480 270 H800"/><path d="M800 320 H480"/></g><g font-size="13" text-anchor="middle"><text x="320" y="208">Observation + investigation request</text><text x="640" y="257">Reactive peer investigation</text><text x="640" y="307">Persist assignment before contribution</text></g><text x="800" y="356" fill="#68716B" font-size="12" text-anchor="middle">Inspect and contribute</text><text x="36" y="409" fill="#68716B" font-size="12">The demo uses deterministic inference on the real Mozaik runtime. Participation alone does not confirm a finding.</text></g></svg>