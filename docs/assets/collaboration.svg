<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Parallel users and reactive collaboration through Mozaik</title>
  <desc id="description">Two users inspect independently. An observation and investigation request enter shared state; a peer reacts, persists its assignment and contributes. This is an illustrative coordination flow, not a recording of live reasoning.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#237763"/></marker></defs>
  <rect width="960" height="440" rx="10" fill="#F6F6F3"/>
  <g font-family="system-ui, sans-serif" fill="#222724">
    <text x="36" y="40" font-size="21" font-weight="600">Parallel turns. Shared observations.</text>
    <text x="36" y="66" font-size="13" fill="#68716B">Illustrative flow of the controlled Mozaik integration demo</text>
    <g fill="#FFFFFF" stroke="#DADDD6"><rect x="80" y="94" width="160" height="44" rx="6"/><rect x="355" y="94" width="250" height="44" rx="6" fill="#E1EFE9"/><rect x="720" y="94" width="160" height="44" rx="6"/></g>
    <g text-anchor="middle" font-size="14"><text x="160" y="122">User A</text><text x="480" y="122" fill="#237763">Mozaik / shared state</text><text x="800" y="122">User B</text></g>
    <g stroke="#DADDD6" stroke-dasharray="4 5"><path d="M160 138 V375"/><path d="M480 138 V375"/><path d="M800 138 V375"/></g>
    <g fill="#EEEFEA"><rect x="85" y="153" width="150" height="32" rx="4"/><rect x="725" y="153" width="150" height="32" rx="4"/></g>
    <g font-size="12" text-anchor="middle" fill="#68716B"><text x="160" y="174">Independent inspection</text><text x="800" y="174">Independent inspection</text></g>
    <g stroke="#237763" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M160 221 H480"/><path d="M480 270 H800"/><path d="M800 320 H480"/></g>
    <g font-size="13" text-anchor="middle"><text x="320" y="208">Observation + investigation request</text><text x="640" y="257">Reactive peer investigation</text><text x="640" y="307">Persist assignment before contribution</text></g>
    <text x="800" y="356" font-size="12" text-anchor="middle" fill="#68716B">Inspect and contribute</text>
    <text x="36" y="409" font-size="12" fill="#68716B">The demo uses deterministic inference on the real Mozaik runtime. Participation alone does not confirm a finding.</text>
  </g>
</svg>
